<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="300" viewBox="0 0 1200 300"
     role="img" aria-labelledby="title desc">
  <title id="title">How a skill ships</title>
  <desc id="desc">Four stages: edit SKILL.md, run pnpm changeset, CI opens the version PR, merging tags name@version. Footnote: the owner can run pnpm changeset version locally and push — CI tags by tag existence, not commit messages.</desc>

  <rect width="1200" height="300" rx="24" fill="#0B0E11"/>

  <!-- stage 1 -->
  <g transform="translate(56 52)">
    <rect width="236" height="152" rx="16" fill="#131920" stroke="#232C36" stroke-width="2"/>
    <text x="20" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#57636F">01</text>
    <text x="20" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#EDF1F5">SKILL.md</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans', sans-serif" font-size="18" fill="#8FA0AD">
      <text x="20" y="114">edit a skill package</text>
      <text x="20" y="138">text stays English</text>
    </g>
  </g>

  <!-- stage 2 -->
  <g transform="translate(340 52)">
    <rect width="236" height="152" rx="16" fill="#131920" stroke="#232C36" stroke-width="2"/>
    <text x="20" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#57636F">02</text>
    <text x="20" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#EDF1F5">pnpm changeset</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans', sans-serif" font-size="18" fill="#8FA0AD">
      <text x="20" y="114">first release: minor</text>
      <text x="20" y="138">0.0.0 → 0.1.0</text>
    </g>
  </g>

  <!-- stage 3 -->
  <g transform="translate(624 52)">
    <rect width="236" height="152" rx="16" fill="#131920" stroke="#232C36" stroke-width="2"/>
    <text x="20" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#57636F">03</text>
    <text x="20" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#EDF1F5">version PR</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans', sans-serif" font-size="18" fill="#8FA0AD">
      <text x="20" y="114">changesets accumulate</text>
      <text x="20" y="138">until you merge</text>
    </g>
  </g>

  <!-- stage 4 -->
  <g transform="translate(908 52)">
    <rect width="236" height="152" rx="16" fill="#131920" stroke="#232C36" stroke-width="2"/>
    <text x="20" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#57636F">04</text>
    <text x="20" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#3ECF8E">name@version</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans', sans-serif" font-size="18" fill="#8FA0AD">
      <text x="20" y="114">CI tags on merge</text>
      <text x="20" y="138">private packages too</text>
    </g>
  </g>

  <!-- connectors -->
  <g stroke="#3ECF8E" stroke-width="3">
    <line x1="296" y1="128" x2="330" y2="128"/>
    <line x1="580" y1="128" x2="614" y2="128"/>
    <line x1="864" y1="128" x2="898" y2="128"/>
  </g>
  <g fill="#3ECF8E">
    <polygon points="330,121 342,128 330,135"/>
    <polygon points="614,121 626,128 614,135"/>
    <polygon points="898,121 910,128 898,135"/>
  </g>

  <!-- footnote -->
  <line x1="56" y1="230" x2="1144" y2="230" stroke="#232C36" stroke-width="2"/>
  <text x="600" y="264" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#57636F">Owner shortcut: pnpm changeset version locally, push — CI tags by tag existence, not commit messages</text>
</svg>
