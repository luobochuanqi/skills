<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">skills — a versioned home for agent skills</title>
  <desc id="desc">Agent skills monorepo. Left: the name and promise — each skill is a private package, versioned with changesets and tagged name@version by CI. Right: a skill-recon package card showing version 0.1.0, and the flow SKILL.md → changeset → name@version.</desc>

  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#FFFFFF" opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="26" fill="#0B0E11"/>
  <rect width="1200" height="400" rx="26" fill="url(#dots)"/>

  <!-- divider -->
  <line x1="700" y1="64" x2="700" y2="336" stroke="#232C36" stroke-width="2"/>

  <!-- title block -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans', sans-serif">
    <text x="56" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="3" fill="#8FA0AD">AGENT SKILLS · PERSONAL MONOREPO</text>
    <text x="56" y="176" font-size="80" font-weight="700" fill="#EDF1F5">skills</text>
    <text x="56" y="242" font-size="26" fill="#EDF1F5">A versioned home for agent skills —</text>
    <text x="56" y="278" font-size="26" fill="#8FA0AD">each one a package, tagged
      <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#3ECF8E">name@version</tspan>
      by CI.</text>
  </g>
  <text x="56" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#57636F">pnpm workspace · changesets · auto-tag on merge</text>

  <!-- proof: skill package card -->
  <g transform="translate(712 0)">
    <rect x="0" y="52" width="448" height="212" rx="16" fill="#131920" stroke="#232C36" stroke-width="2"/>
    <text x="20" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8FA0AD">packages/skill-recon</text>
    <rect x="336" y="66" width="92" height="30" rx="15" fill="#3ECF8E" fill-opacity="0.12"/>
    <text x="382" y="87" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#3ECF8E">v0.1.0</text>
    <line x1="20" y1="106" x2="428" y2="106" stroke="#232C36"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
      <text x="20" y="136" fill="#EDF1F5">name: skill-recon</text>
      <text x="20" y="166" fill="#8FA0AD">description: scan installed skills</text>
      <text x="20" y="196" fill="#8FA0AD">disable-model-invocation: true</text>
    </g>
    <circle cx="22" cy="240" r="4" fill="#3ECF8E"/>
    <text x="34" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#57636F">CHANGELOG · v0.1.0 · initial release</text>
  </g>

  <!-- proof: release flow -->
  <g transform="translate(712 0)">
    <rect x="0" y="296" width="448" height="44" rx="22" fill="#131920" stroke="#232C36" stroke-width="2"/>
    <text x="224" y="325" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8FA0AD">SKILL.md → changeset → <tspan fill="#3ECF8E">name@version</tspan></text>
  </g>
</svg>
